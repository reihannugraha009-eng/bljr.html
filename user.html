<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog ^v^ - ReHan Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #fdfbf7;
            --ink: #2d3436;
            --crayon-blue: #74b9ff;
            --crayon-red: #ff7675;
            --crayon-yellow: #ffeaa7;
            --crayon-green: #55efc4;
            --drawn-border: 3px solid var(--ink);
            --drawn-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            --drawn-shadow: 4px 4px 0px var(--ink);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Patrick Hand', cursive; }
        body { background-color: var(--paper); color: var(--ink); padding-bottom: 60px; background-image: radial-gradient(#d1d1d1 1px, transparent 1px); background-size: 20px 20px; }
        .hidden { display: none !important; }

        /* Navbar */
        header { background: var(--crayon-yellow); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: var(--drawn-border); position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 0 rgba(0,0,0,0.1); }
        .logo { font-size: 1.8rem; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        
        .btn { padding: 8px 16px; border: var(--drawn-border); border-radius: var(--drawn-radius); cursor: pointer; font-size: 1.1rem; box-shadow: 2px 2px 0px var(--ink); transition: 0.1s; background: white; color: var(--ink); font-weight: bold;}
        .btn:active { transform: translate(2px, 2px); box-shadow: none; }
        .btn-primary { background: var(--crayon-green); }
        .btn-danger { background: var(--crayon-red); }

        .cart-badge { background: var(--crayon-red); color: white; padding: 2px 8px; border-radius: 50%; border: 2px solid var(--ink); margin-left: 5px; }

        /* Banner */
        .hero-banner { background: var(--crayon-blue); margin: 25px 5%; padding: 30px; border: var(--drawn-border); border-radius: var(--drawn-radius); box-shadow: var(--drawn-shadow); text-align: center; }
        .hero-banner h1 { font-size: 2.2rem; }
        
        .container { max-width: 1200px; margin: 30px auto; padding: 0 5%; }
        
        /* Search */
        .search-container { margin-bottom: 20px; display: flex; justify-content: flex-end; }
        .search-input { padding: 10px 20px; border: var(--drawn-border); border-radius: var(--drawn-radius); width: 100%; max-width: 300px; font-size: 1.1rem; outline: none; background: white; box-shadow: 2px 2px 0px var(--ink); }

        /* Grid Produk */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .product-card { background: white; border: var(--drawn-border); border-radius: var(--drawn-radius); padding: 15px; display: flex; flex-direction: column; box-shadow: var(--drawn-shadow); transition: 0.2s; }
        .product-card:hover { transform: translateY(-5px) rotate(-1deg); }
        .product-img { width: 100%; height: 180px; border: 2px solid var(--ink); border-radius: 10px; margin-bottom: 10px; object-fit: cover; }
        .product-title { font-size: 1.3rem; font-weight: bold; line-height: 1.2; }
        .product-price { font-size: 1.2rem; background: var(--crayon-yellow); display: inline-block; padding: 2px 8px; border: 2px solid var(--ink); border-radius: 10px; margin: 10px 0; transform: rotate(-2deg); }

        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 200; }
        .modal-card { background: var(--paper); border: var(--drawn-border); border-radius: var(--drawn-radius); padding: 25px; width: 90%; max-width: 450px; box-shadow: 8px 8px 0px var(--ink); max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px dashed var(--ink); padding-bottom: 10px; }
        .modal-header h3 { font-size: 1.6rem; }
        
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed var(--ink); }
        .form-control { width: 100%; padding: 10px; border: 2px solid var(--ink); border-radius: 10px; outline: none; font-size: 1.1rem; margin-bottom: 15px; background: white; }
        /* --- JURUS TAMPILAN HP UNTUK USER (KATALOG) --- */
        @media (max-width: 768px) {
            header { flex-direction: column; gap: 15px; text-align: center; }
            .hero-banner h1 { font-size: 1.6rem; }
            .hero-banner p { font-size: 1rem; }
            .search-container { justify-content: center; }
            .search-input { max-width: 100%; width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">ReHan Shop ^v^</div>
        <div style="display: flex; gap: 10px;">
            <button class="btn" onclick="bukaModal('modal-keranjang')">🛒 Tas<span class="cart-badge" id="cart-count">0</span></button>
            <button class="btn btn-danger" onclick="window.location.href='index.html'">Keluar</button>
        </div>
    </header>

    <div class="hero-banner">
        <h1>✨ Koleksi Crayon 2026 ✨</h1>
        <p>Barang-barang lucu yang diwarnai khusus buat kamu!</p>
    </div>

    <div class="container">
        <div class="search-container">
            <input type="text" id="search-input" class="search-input" placeholder="Cari mainan atau baju..." oninput="cariBarang()">
        </div>

        <div class="product-grid" id="product-list"></div>
    </div>

    <!-- Modal Keranjang -->
    <div id="modal-keranjang" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Isi Tas Belanja ^v^</h3>
                <button class="btn btn-danger" onclick="tutupModal('modal-keranjang')">X</button>
            </div>
            <div id="cart-items-container"></div>
            <div style="font-size: 1.3rem; font-weight: bold; margin: 15px 0;">Total: <span id="cart-total-price">Rp 0</span></div>
            <button class="btn btn-primary" style="width: 100%;" onclick="lanjutKeCheckout()">Bayar Sekarang!</button>
        </div>
    </div>

    <!-- Modal Checkout -->
    <div id="modal-checkout" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Kirim ke mana nih? 📦</h3>
                <button class="btn btn-danger" onclick="tutupModal('modal-checkout')">X</button>
            </div>
            <form onsubmit="prosesPesanan(event)">
                <label>Nama Kamu:</label>
                <input type="text" class="form-control" required>
                <label>Alamat Rumah:</label>
                <input type="text" class="form-control" required>
                <label>Cara Bayar:</label>
                <select class="form-control" required>
                    <option value="">Pilih dulu ya...</option>
                    <option>Uang Kertas (COD)</option>
                    <option>Transfer Celengan (Bank)</option>
                </select>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Deal! Beli</button>
            </form>
        </div>
    </div>

    <script>
        // 12 Barang yang udah ditambahin
        const products = [
            { id: 1, nama: "Sepatu Lari Kece", kategori: "Baju", harga: 250000, gambar: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&q=80" },
            { id: 2, nama: "Tas Sekolah Gede", kategori: "Aksesoris", harga: 150000, gambar: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500&q=80" },
            { id: 3, nama: "Jam Tangan Robot", kategori: "Mainan", harga: 300000, gambar: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&q=80" },
            { id: 4, nama: "Set Krayon 24 Warna", kategori: "Alat Tulis", harga: 45000, gambar: "https://images.unsplash.com/photo-1513364776144-60967b0f800f?w=500&q=80" },
            { id: 5, nama: "Buku Gambar A3", kategori: "Alat Tulis", harga: 35000, gambar: "https://images.unsplash.com/photo-1544816155-12df9643f363?w=500&q=80" },
            { id: 6, nama: "Topi Kelinci Hangat", kategori: "Aksesoris", harga: 85000, gambar: "https://images.unsplash.com/photo-1576618148400-f54bed99fcfd?w=500&q=80" },
            { id: 7, nama: "Botol Minum Dinosaurus", kategori: "Aksesoris", harga: 60000, gambar: "https://images.unsplash.com/photo-1602143407151-7111542de6e8?w=500&q=80" },
            { id: 8, nama: "Pensil Mekanik Pro", kategori: "Alat Tulis", harga: 25000, gambar: "https://images.unsplash.com/photo-1585336261022-680e295ce3fe?w=500&q=80" },
            { id: 9, nama: "Jaket Tebal Kuning", kategori: "Baju", harga: 180000, gambar: "https://images.unsplash.com/photo-1551028719-00167b16eac5?w=500&q=80" },
            { id: 10, nama: "Kotak Pensil Tingkat", kategori: "Alat Tulis", harga: 55000, gambar: "https://images.unsplash.com/photo-1590845947698-8924d7409b56?w=500&q=80" },
            { id: 11, nama: "Papan Tulis Mini", kategori: "Alat Tulis", harga: 40000, gambar: "https://images.unsplash.com/photo-1503676260728-1c00da094a0b?w=500&q=80" },
            { id: 12, nama: "Ransel Astronot", kategori: "Aksesoris", harga: 200000, gambar: "https://images.unsplash.com/photo-1622560480654-d96214ebc8ce?w=500&q=80" }
        ];

        let cart = [];
        const formatRupiah = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);

        function renderProducts(daftar = products) {
            const container = document.getElementById('product-list');
            container.innerHTML = '';
            daftar.forEach(p => {
                container.innerHTML += `
                    <div class="product-card">
                        <img src="${p.gambar}" class="product-img">
                        <div class="product-title">${p.nama}</div>
                        <div class="product-price">${formatRupiah(p.harga)}</div>
                        <button class="btn btn-primary" onclick="tambahKeKeranjang(${p.id})">+ Masukin Tas</button>
                    </div>`;
            });
        }

        function cariBarang() {
            const keyword = document.getElementById('search-input').value.toLowerCase();
            renderProducts(products.filter(p => p.nama.toLowerCase().includes(keyword) || p.kategori.toLowerCase().includes(keyword)));
        }

        function tambahKeKeranjang(id) {
            const p = products.find(x => x.id === id);
            const item = cart.find(x => x.id === id);
            item ? item.qty++ : cart.push({ ...p, qty: 1 });
            updateCartUI();
            alert(`Yey! ${p.nama} masuk ke tas! ^v^`);
        }

        function hapusDariKeranjang(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.reduce((tot, item) => tot + item.qty, 0);
            const container = document.getElementById('cart-items-container');
            container.innerHTML = '';
            let total = 0;
            cart.forEach(item => {
                const sub = item.harga * item.qty;
                total += sub;
                container.innerHTML += `
                    <div class="cart-item">
                        <div><strong>${item.nama}</strong> (x${item.qty})</div>
                        <div style="display:flex; gap:10px; align-items:center;">
                            <span>${formatRupiah(sub)}</span>
                            <button class="btn btn-danger" onclick="hapusDariKeranjang(${item.id})">Buang</button>
                        </div>
                    </div>`;
            });
            document.getElementById('cart-total-price').innerText = formatRupiah(total);
        }

        function lanjutKeCheckout() {
            if(cart.length === 0) return alert("Tasnya masih kosong nih!");
            tutupModal('modal-keranjang'); bukaModal('modal-checkout');
        }

        function prosesPesanan(e) {
            e.preventDefault();
            alert("Hore! Barang kamu segera dikirim! Terima kasih ^v^");
            cart = []; updateCartUI(); tutupModal('modal-checkout'); e.target.reset();
        }

        function bukaModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function tutupModal(id) { document.getElementById(id).classList.add('hidden'); }

        renderProducts();
    </script>
</body>
</html>
