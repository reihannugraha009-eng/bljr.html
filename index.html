<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReHan Shop ^v^</title>
    <!-- Font Tulisan Tangan -->
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #fdfbf7;
            --ink: #2d3436;
            --crayon-blue: #74b9ff;
            --crayon-red: #ff7675;
            --drawn-border: 3px solid var(--ink);
            --drawn-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            --drawn-shadow: 5px 5px 0px var(--ink);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Patrick Hand', cursive; }
        
        body {
            background-color: var(--paper);
            color: var(--ink);
            background-image: radial-gradient(#d1d1d1 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .landing-card {
            background: white;
            padding: 40px;
            text-align: center;
            max-width: 450px;
            width: 100%;
            border: var(--drawn-border);
            border-radius: var(--drawn-radius);
            box-shadow: var(--drawn-shadow);
        }

        .mascot {
            font-size: 4rem;
            font-weight: bold;
            color: var(--ink);
            margin-bottom: 10px;
            display: inline-block;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 { font-size: 2.5rem; margin-bottom: 10px; letter-spacing: 1px; }
        p { font-size: 1.2rem; margin-bottom: 30px; }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: block;
            padding: 15px;
            font-size: 1.3rem;
            text-decoration: none;
            color: var(--ink);
            font-weight: bold;
            border: var(--drawn-border);
            border-radius: var(--drawn-radius);
            box-shadow: 3px 3px 0px var(--ink);
            transition: all 0.1s ease;
        }

        .btn-user { background-color: var(--crayon-blue); }
        .btn-admin { background-color: var(--crayon-red); }

        .btn:active {
            transform: translate(3px, 3px);
            box-shadow: 0px 0px 0px var(--ink);
        }
        /* --- JURUS TAMPILAN HP UNTUK INDEX --- */
        @media (max-width: 480px) {
            h1 { font-size: 2rem; }
            .mascot { font-size: 3rem; }
            .landing-card { padding: 25px 15px; }
            .btn { font-size: 1.1rem; padding: 12px; }
        }
    </style>
</head>
<body>

    <div class="landing-card">
        <div class="mascot">^v^</div>
        <h1>Selamat Datang!</h1>
        <p>Di ReHan Shop versi Crayon, tempat belanja paling asyik sedunia!</p>
        
        <div class="btn-container">
            <a href="user.html" class="btn btn-user">🛍️ Masuk sebagai Pembeli</a>
            <a href="admin.html" class="btn btn-admin">🛡️ Masuk sebagai Admin</a>
        </div>
    </div>

</body>
</html>
