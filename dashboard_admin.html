<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Admin ^v^</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #fdfbf7; --ink: #2d3436; --crayon-blue: #74b9ff;
            --crayon-red: #ff7675; --crayon-yellow: #ffeaa7; --crayon-green: #55efc4;
            --drawn-border: 3px solid var(--ink);
            --drawn-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Patrick Hand', cursive; }
        body { background-color: var(--paper); color: var(--ink); display: flex; height: 100vh; background-image: radial-gradient(#d1d1d1 1px, transparent 1px); background-size: 20px 20px; }

        /* Sidebar */
        .sidebar { width: 250px; background: var(--crayon-blue); border-right: var(--drawn-border); padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
        .sidebar h2 { text-align: center; border-bottom: 2px dashed var(--ink); padding-bottom: 15px; margin-bottom: 20px; }
        .menu { list-style: none; flex-grow: 1; }
        .menu li { margin-bottom: 15px; }
        .menu a { text-decoration: none; color: var(--ink); font-size: 1.2rem; padding: 10px; display: block; border-radius: var(--drawn-radius); border: 2px solid transparent; transition: 0.2s;}
        .menu a:hover, .menu a.active { background: white; border: var(--drawn-border); box-shadow: 2px 2px 0 var(--ink); font-weight: bold; }
        .btn-keluar { background: var(--crayon-red); color: white; padding: 10px; text-align: center; border: var(--drawn-border); border-radius: var(--drawn-radius); cursor: pointer; font-size: 1.2rem; font-weight: bold; width: 100%; box-shadow: 2px 2px 0 var(--ink); }

        /* Main Content */
        .main-content { flex-grow: 1; padding: 30px; overflow-y: auto; }
        .page-title { background: var(--crayon-yellow); display: inline-block; padding: 10px 20px; border: var(--drawn-border); border-radius: var(--drawn-radius); box-shadow: 4px 4px 0 var(--ink); margin-bottom: 30px; font-size: 1.8rem; }

        /* Tabel */
        .table-container { background: white; border: var(--drawn-border); border-radius: var(--drawn-radius); padding: 20px; box-shadow: 4px 4px 0 var(--ink); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { background: var(--crayon-green); border: 2px solid var(--ink); padding: 12px; text-align: left; }
        td { border: 2px dashed var(--ink); padding: 12px; border-bottom: 1px dashed #ccc;}
        
        .btn-action { background: var(--crayon-yellow); border: 2px solid var(--ink); padding: 8px 12px; cursor: pointer; border-radius: 10px; font-weight: bold; font-size: 1rem; box-shadow: 2px 2px 0 var(--ink);}
        .btn-action:active { transform: translate(2px, 2px); box-shadow: none; }
        .btn-action.done { background: #ccc; box-shadow: none; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div>
            <h2>Buku Admin ^v^</h2>
            <ul class="menu">
                <li><a href="#">✏️ Coretan Utama</a></li>
                <li><a href="#">📦 Lemari Barang</a></li>
                <li><a href="#">🗓️ Buku Kas</a></li>
                <li><a href="#" class="active">🛒 Pesanan Masuk</a></li>
                <li><a href="#">🚚 Data Suplier</a></li>
            </ul>
        </div>
        <button class="btn-keluar" onclick="window.location.href='index.html'">Tutup Buku</button>
    </div>

    <div class="main-content">
        <h1 class="page-title">Cek Pesanan Pembeli</h1>

        <div class="table-container">
            <h3>Daftar Pembelian Klien Baru 🛍️</h3>
            <p>Klik konfirmasi kalau barangnya udah siap dikirim ya!</p>

            <table>
                <thead>
                    <tr>
                        <th>Pembeli & Alamat</th>
                        <th>Barang yang Dipesan</th>
                        <th>Total & Cara Bayar</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tabel-pesanan">
                    <!-- Nanti data dari user.html muncul di sini -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function muatPesanan() {
            const tbody = document.getElementById('tabel-pesanan');
            // Cek kotak surat (localStorage) ada kiriman pesanan gak
            const daftarPesanan = JSON.parse(localStorage.getItem('pesananRehanShop')) || [];

            if (daftarPesanan.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 20px;">Yah, belum ada pesanan baru masuk hari ini...</td></tr>';
                return;
            }

            // Kalau ada, kita gambar ulang tabelnya
            tbody.innerHTML = '';
            daftarPesanan.forEach((pesanan, index) => {
                const isSelesai = pesanan.status === 'Sudah Dikirim';
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${pesanan.pembeli}</strong><br><small>${pesanan.alamat}</small></td>
                        <td>${pesanan.barang}</td>
                        <td><strong>${pesanan.total}</strong><br><small>${pesanan.pembayaran}</small></td>
                        <td>
                            <button class="btn-action ${isSelesai ? 'done' : ''}" 
                                    onclick="selesaikanPesanan(${index})" 
                                    ${isSelesai ? 'disabled' : ''}>
                                ${isSelesai ? '✅ Selesai' : 'Kirim Sekarang!'}
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        function selesaikanPesanan(index) {
            let daftarPesanan = JSON.parse(localStorage.getItem('pesananRehanShop')) || [];
            daftarPesanan[index].status = 'Sudah Dikirim'; // Ganti statusnya
            localStorage.setItem('pesananRehanShop', JSON.stringify(daftarPesanan)); // Simpen lagi
            muatPesanan(); // Refresh tampilan tabelnya
            alert('Asyik! Barang udah meluncur ke pembeli! ^v^');
        }

        // Langsung panggil fungsinya pas halaman admin dibuka
        muatPesanan();
    </script>
</body>
</html>
