<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Admin ^v^</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --paper: #fdfbf7;
            --ink: #2d3436;
            --crayon-blue: #74b9ff;
            --crayon-red: #ff7675;
            --crayon-yellow: #ffeaa7;
            --crayon-green: #55efc4;
            --drawn-border: 3px solid var(--ink);
            --drawn-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            --drawn-shadow: 4px 4px 0px var(--ink);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Patrick Hand', cursive; }
        body { background-color: var(--paper); color: var(--ink); background-image: radial-gradient(#d1d1d1 1px, transparent 1px); background-size: 20px 20px; overflow-x: hidden; }
        .hidden { display: none !important; }

        /* Layout */
        #admin-app { display: flex; min-height: 100vh; }
        
        /* Sidebar */
        .sidebar { width: 250px; background-color: var(--crayon-blue); padding: 20px; border-right: var(--drawn-border); display: flex; flex-direction: column; gap: 15px; z-index: 10; box-shadow: 2px 0 0px var(--ink); }
        .sidebar-brand { font-size: 1.8rem; font-weight: bold; text-align: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px dashed var(--ink); }
        .menu-item { padding: 10px 15px; border: 2px solid transparent; cursor: pointer; font-size: 1.2rem; font-weight: bold; transition: 0.2s; border-radius: 10px; }
        .menu-item:hover { border: 2px dashed var(--ink); }
        .menu-item.active { background: white; border: var(--drawn-border); border-radius: var(--drawn-radius); box-shadow: 2px 2px 0px var(--ink); transform: rotate(-2deg); }

        /* Content Area */
        .main-content { flex-grow: 1; padding: 30px; overflow-y: auto; }
        .header-title { font-size: 2rem; margin-bottom: 20px; display: inline-block; background: var(--crayon-yellow); padding: 5px 15px; border: var(--drawn-border); border-radius: var(--drawn-radius); transform: rotate(1deg); box-shadow: var(--drawn-shadow); }

        /* Cards & Tables */
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card-stat { background: white; border: var(--drawn-border); border-radius: var(--drawn-radius); padding: 20px; box-shadow: var(--drawn-shadow); text-align: center; }
        .card-stat h3 { font-size: 1.3rem; margin-bottom: 5px; }
        .card-stat .value { font-size: 2.2rem; font-weight: bold; color: var(--crayon-red); }

        .card-table { background: white; border: var(--drawn-border); border-radius: var(--drawn-radius); padding: 20px; box-shadow: var(--drawn-shadow); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 2px dashed var(--ink); font-size: 1.1rem; }
        th { background: var(--crayon-green); border: var(--drawn-border); }
        
        .btn { padding: 8px 16px; border: var(--drawn-border); border-radius: var(--drawn-radius); cursor: pointer; font-size: 1.1rem; box-shadow: 2px 2px 0px var(--ink); background: white; font-weight: bold; transition: 0.1s; }
        .btn:active { transform: translate(2px, 2px); box-shadow: none; }
        .btn-danger { background: var(--crayon-red); color: white; }
    </style>
</head>
<body>

    <div id="admin-app">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-brand">Buku Admin ^v^</div>
            <a class="menu-item active" onclick="bukaTab('dashboard', this)">🖍️ Coretan Utama</a>
            <a class="menu-item" onclick="bukaTab('produk', this)">📦 Lemari Barang</a>
            <div style="margin-top: auto;">
                <button class="btn btn-danger" style="width: 100%;" onclick="window.location.href='index.html'">Tutup Buku (Keluar)</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <h2 class="header-title" id="page-title">Coretan Utama Hari Ini</h2>

            <!-- TAB 1: DASHBOARD -->
            <div id="tab-dashboard" class="tab-content">
                <div class="grid-3">
                    <div class="card-stat">
                        <h3>Total Mainan</h3>
                        <div class="value" id="stat-barang">3</div>
                    </div>
                    <div class="card-stat">
                        <h3>Uang Terkumpul</h3>
                        <div class="value" id="stat-uang">Rp 0</div>
                    </div>
                </div>

                <div class="card-table">
                    <h3 style="margin-bottom: 15px;">Grafik Jualan 📈</h3>
                    <div style="height: 300px;">
                        <canvas id="chartGambar"></canvas>
                    </div>
                </div>
            </div>

            <!-- TAB 2: PRODUK -->
            <div id="tab-produk" class="tab-content hidden">
                <div class="card-table">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                        <h3>Isi Lemari Barang</h3>
                        <button class="btn" style="background: var(--crayon-yellow);" onclick="alert('Fitur tambah gambar belum dikasih spidol warna! (Coming Soon)')">+ Gambar Barang Baru</button>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>Nama Barang</th>
                                <th>Kelompok</th>
                                <th>Harga Jual</th>
                                <th>Stok Sisa</th>
                            </tr>
                        </thead>
                        <tbody id="tabel-barang"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Set Chart.js Font to match our Crayon Style!
        Chart.defaults.font.family = "'Patrick Hand', cursive";
        Chart.defaults.font.size = 14;
        Chart.defaults.color = "#2d3436";

        let myChartInstance = null;
        let dataBarang = [
            { nama: "Sepatu Lari Kece", kategori: "Baju", harga: 250000, stok: 15 },
            { nama: "Tas Sekolah Gede", kategori: "Aksesoris", harga: 150000, stok: 8 },
            { nama: "Jam Tangan Robot", kategori: "Mainan", harga: 300000, stok: 10 }
        ];

        const formatRupiah = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);

        function bukaTab(tabName, element) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.add('hidden'));
            document.querySelectorAll('.menu-item').forEach(menu => menu.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.remove('hidden');
            element.classList.add('active');

            if(tabName === 'dashboard') {
                document.getElementById('page-title').innerText = "Coretan Utama Hari Ini";
                refreshDashboard();
            }
            if(tabName === 'produk') {
                document.getElementById('page-title').innerText = "Lemari Barang Kita";
                renderTabelBarang();
            }
        }

        function refreshDashboard() {
            document.getElementById('stat-barang').innerText = dataBarang.length;
            document.getElementById('stat-uang').innerText = formatRupiah(700000); // Dummy data

            const ctx = document.getElementById('chartGambar').getContext('2d');
            if (myChartInstance) myChartInstance.destroy();
            myChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat'],
                    datasets: [{
                        label: 'Uang Jajan Masuk',
                        data: [150000, 200000, 50000, 300000, 700000],
                        backgroundColor: '#ff7675',
                        borderColor: '#2d3436',
                        borderWidth: 3,
                        borderRadius: 10
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function renderTabelBarang() {
            const tbody = document.getElementById('tabel-barang');
            tbody.innerHTML = '';
            dataBarang.forEach(brg => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${brg.nama}</strong></td>
                        <td>${brg.kategori}</td>
                        <td style="background:var(--crayon-yellow); font-weight:bold; border:2px solid var(--ink); display:inline-block; margin:5px; transform:rotate(-2deg);">${formatRupiah(brg.harga)}</td>
                        <td>${brg.stok} buah</td>
                    </tr>`;
            });
        }

        refreshDashboard();
    </script>
</body>
</html>
